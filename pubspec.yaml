name: project
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1
  mobile_scanner: ^7.2.0
  firebase_core: ^4.5.0
  cloud_firestore: ^6.1.3
  google_mlkit_text_recognition: ^0.15.1
  firebase_auth: ^6.2.0
  pdf: ^3.11.3
  printing: ^5.14.2
  connectivity_plus: ^7.0.0
  google_generative_ai: ^0.4.7
  shimmer: ^3.0.0
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 🔥 App Icon හදන්න අවශ්‍ය පැකේජ් එක
  flutter_launcher_icons: ^0.13.1

# 🔥 App Icon Configuration කොටස
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#0056b3"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  # 🔥 Assets කොටසට icon path එක එකතු කළා
  assets:
    - assets/images/app_icon.png